name: Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.event_name == 'push' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: node scripts/set-version.mjs "$RELEASE_TAG"
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Package
        run: npm run package
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/package.zip
            releases/siyuan-plugin-card-tree-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
